name: Paper

on:
  pull_request:
    paths:
      - "paper/**"
      - ".github/workflows/paper.yml"
  push:
    branches: [main]
    paths:
      - "paper/**"
      - ".github/workflows/paper.yml"

permissions:
  contents: read

jobs:
  quarto:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true

      - name: Install paper TeX packages
        run: |
          TLMGR="$(find "$HOME" -path '*/bin/*/tlmgr' | head -n 1)"
          if [ -z "$TLMGR" ]; then
            echo "tlmgr not found"
            exit 1
          fi
          "$TLMGR" update --self
          "$TLMGR" install \
            a4wide \
            booktabs \
            caption \
            chngcntr \
            datetime \
            diagbox \
            econ-bst \
            float \
            fnpct \
            fontawesome \
            footmisc \
            kpfonts \
            kpfonts-otf \
            multirow \
            natbib \
            paralist \
            pgf \
            pgfplots \
            pict2e \
            psfrag \
            sectsty \
            subfigure \
            threeparttable \
            todonotes \
            translations

      - name: Render paper PDF
        run: |
          cd paper
          quarto render index.qmd --to pdf

      - name: Upload rendered PDF
        uses: actions/upload-artifact@v4
        with:
          name: paper-pdf
          path: paper/out/*.pdf
          if-no-files-found: error

      - name: Render paper HTML
        run: |
          cd paper
          python3 build_site.py

      # Issue #27: deploy the rendered site on pushes to main. Requires the
      # VERCEL_TOKEN repository secret (Vercel account token scoped to the
      # policy-engine team); the step is skipped when the secret is absent.
      - name: Deploy paper site to Vercel
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.VERCEL_TOKEN != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_policy-engine
          VERCEL_PROJECT_ID: prj_mS32QkNiwP6zaMRTQKfLwZ2aKMLo
        run: |
          printf '{"framework": null}\n' > paper/site/vercel.json
          npx --yes vercel@latest deploy paper/site --prod --yes --token "$VERCEL_TOKEN"
